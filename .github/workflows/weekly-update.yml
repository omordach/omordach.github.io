name: Weekly Dependency Updates

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update minor/patch dependencies
        id: update
        run: |
          echo "REPORT<<EOF2" >> $GITHUB_OUTPUT
          npx npm-check-updates --target minor -u >> $GITHUB_OUTPUT
          echo "EOF2" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: bun install

      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Run automated test suite
        if: steps.check-changes.outputs.has_changes == 'true'
        run: bun run test

      - name: Verify live site is online
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mordach.com/)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Site is not returning 200 OK. Status code: $HTTP_STATUS"
            false
          else
            echo "Site is online and responsive."
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: weekly dependency updates"
          title: "chore: weekly dependency updates"
          branch: chore/weekly-dependency-updates
          delete-branch: true
          body: |
            This PR was auto-generated by the Weekly Dependency Updates workflow.

            ### Updates Summary
            ```text
            ${{ steps.update.outputs.REPORT }}
            ```

            ### Verification
            ✅ Automated tests (`bun run test`) passed.
            ✅ Live site (`https://mordach.com/`) is online and responsive.

            **Action Required:** Please perform a manual review to ensure the site behaves as expected with these updated versions.
